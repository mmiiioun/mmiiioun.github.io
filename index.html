<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김미주 · AI Research Engineer</title>
<meta name="description" content="고려대학교 정보보호대학원 AI Research Lab · 보안을 중심으로 Robotics AI(Computer Vision), LLM, XAI, Anomaly Detection 연구">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mmiiioun.github.io/">
<meta property="og:title" content="김미주 · AI Research Engineer">
<meta property="og:description" content="보안을 중심으로 Robotics AI(Computer Vision), LLM, XAI, Anomaly Detection을 연구합니다.">
<meta property="og:image" content="https://mmiiioun.github.io/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,700&family=Instrument+Serif&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fcfbfe}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .6s ease}
iframe.on{opacity:1}
#intro{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fcfbfe;color:#24212b;font-family:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;cursor:pointer;transition:opacity .6s ease}
#intro.out{opacity:0;pointer-events:none}
.l1,.l2{display:flex;align-items:center;white-space:nowrap;line-height:1;min-height:1em}
.l1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(46px,11.5vw,140px);letter-spacing:-0.02em}
.l2{font-style:italic;font-weight:700;font-size:clamp(46px,11.5vw,136px);letter-spacing:-0.03em;margin-top:.06em}
.l2 .mono{font-family:inherit}
.cur{display:inline-block;width:.045em;min-width:2px;height:.95em;background:#24212b;margin-left:.06em;visibility:hidden}
.cur.on{visibility:visible;animation:blink .9s steps(1) infinite}
.bar{margin-top:clamp(22px,4vw,40px);width:min(220px,50vw);height:3px;border-radius:2px;background:linear-gradient(90deg,#440154,#3b528b,#21918c,#5ec962,#fde725);clip-path:inset(0 100% 0 0 round 2px);transition:clip-path .5s cubic-bezier(.3,.7,.2,1)}
.bar.on{clip-path:inset(0 0 0 0 round 2px)}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div id="intro" aria-hidden="true">
  <div class="l1"><span id="t1"></span><span class="cur" id="c1"></span></div>
  <div class="l2"><span id="t2"></span><span class="cur" id="c2"></span></div>
  <div class="bar" id="bar"></div>
</div>
<iframe id="site" src="portfolio.html" title="김미주 포트폴리오"></iframe>
<script>
(function(){
  var intro=document.getElementById('intro'),fr=document.getElementById('site');
  var t1=document.getElementById('t1'),t2=document.getElementById('t2'),c1=document.getElementById('c1'),c2=document.getElementById('c2'),bar=document.getElementById('bar');
  var done=false,animDone=false,siteReady=false;
  function reveal(){ if(done) return; done=true; fr.classList.add('on'); intro.classList.add('out'); setTimeout(function(){ intro.remove(); },700); }
  function maybe(){ if(animDone && siteReady) setTimeout(reveal,150); }
  intro.addEventListener('click',reveal);
  var seen=false;
  var wait=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
  function type(el,s,ms){ var i=0; return new Promise(function(r){ (function n(){ if(done) return r(); if(i>=s.length) return r(); el.textContent+=s[i++]; setTimeout(n,ms); })(); }); }
  function erase(el,ms){ return new Promise(function(r){ (function n(){ if(done) return r(); if(!el.textContent.length) return r(); el.textContent=el.textContent.slice(0,-1); setTimeout(n,ms); })(); }); }
  var CH='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&$@*<>/';
  async function decode(el,T){
    el.innerHTML=T.split('').map(function(){return '<span></span>';}).join('');
    var sp=[].slice.call(el.children),t0=performance.now();
    while(!done){
      var t=performance.now()-t0,all=true;
      sp.forEach(function(s,i){ if(t>=280+i*70){ s.textContent=T[i]; s.className=''; s.style.opacity=1; } else { all=false; s.textContent=CH[(Math.random()*CH.length)|0]; s.className='mono'; s.style.opacity=t<i*30?0:1; } });
      if(all) break; await wait(40);
    }
    el.textContent=T;
  }
  async function run(){
    t1.textContent='AI \u00d7 SECURITY';
    if(seen){ t2.textContent='PORTFOLIO'; bar.classList.add('on'); await wait(500); animDone=true; maybe(); return; }
    if(document.fonts&&document.fonts.ready) await Promise.race([document.fonts.ready,wait(1500)]);
    await wait(250); await decode(t2,'PORTFOLIO');
    bar.classList.add('on'); await wait(650);
    animDone=true; maybe();
  }
  run();
  function ready(){ try{ var d=fr.contentDocument; return !!(d && d.querySelector('nav')); }catch(e){ return true; } }
  var poll=setInterval(function(){ if(ready()){ clearInterval(poll); siteReady=true; maybe(); } },120);
  setTimeout(function(){ siteReady=true; maybe(); },5000);
})();
</script>
</body>
</html>
